syntax = "proto3";

package gamepademu;

option java_package = "com.zyz4.gamepademu.proto";
option java_multiple_files = true;
option csharp_namespace = "GamepadEmu.Protocol";

message ClientToServer {
  oneof payload {
    Hello hello = 1;
    GamepadInput gamepad_input = 2;
  }
}

message Hello {
  uint32 protocol_version = 1;
  string device_name = 2;
  uint32 controller_index = 4;
}

message GamepadInput {
  uint32 buttons = 1;
  sint32 left_stick_x = 2;
  sint32 left_stick_y = 3;
  sint32 right_stick_x = 4;
  sint32 right_stick_y = 5;
  uint32 left_trigger = 6;
  uint32 right_trigger = 7;
  uint32 dpad = 8;
  float gyro_x = 9;
  float gyro_y = 10;
  float gyro_z = 11;
  float accel_x = 12;
  float accel_y = 13;
  float accel_z = 14;
  uint32 battery_level = 16;
  bool is_charging = 17;
  uint32 touchpad_x = 18;
  uint32 touchpad_y = 19;
  bool touchpad_touch = 20;
  bool touchpad_click = 21;
  repeated TouchPoint touches = 22;
  // Mouse fields for high-precision scroll and relative movement
  sint32 mouse_dx = 23;
  sint32 mouse_dy = 24;
  sint32 mouse_wheel = 25;
  sint32 mouse_pan = 26;
  uint32 mouse_buttons = 27;

  // Keyboard fields — scan codes in Microsoft Standard Scan Code (UTF)
  repeated uint32 pressed_scan_codes = 28;
  repeated uint32 released_scan_codes = 29;
  uint32 keyboard_modifiers = 30;
}

message TouchPoint {
  uint32 id = 1;
  uint32 x = 2;
  uint32 y = 3;
  bool active = 4;
}

message ServerToClient {
  oneof payload {
    CompactFrame compact_frame = 11;
    Vibration vibration = 1;
    TriggerEffects trigger_effects = 2;
    Disconnect disconnect = 3;
    ServerHello server_hello = 7;
    AudioFrame audio_frame = 8;
    LedState led_state = 9;
    TestTone test_tone = 10;
  }
}

message TriggerEffects {
  bytes left_trigger_effect = 1;
  bytes right_trigger_effect = 2;
}

/// 1 kHz test-tone state for the DualSense speaker test (WAVEOUT_CTRL).
/// When enabled the phone synthesises the tone locally and plays it; the PC
/// no longer streams test-tone PCM over the audio lane.
message TestTone {
  bool enabled = 1;
}

/// Emulated controller LED state. color is 0xRRGGBB; controllers without an
/// LED (e.g. Xbox 360) send 0x000000. player_led is the player indicator
/// bitmask (bit0 = LED 1 ...).
message LedState {
  uint32 color = 1;
  uint32 player_led = 2;
}

message AudioFrame {
  uint32 sample_rate_hz = 1;
  uint32 channels = 2;
  uint32 bits_per_sample = 3;
  uint32 frame_index = 4;
  uint32 sample_count = 5;
  bytes pcm = 6;
}

message ServerHello {
  uint32 protocol_version = 1;
  string host_name = 2;
  uint32 max_downlink_rate_hz = 3;
  uint32 recommended_uplink_interval_us = 4;
}

message Vibration {
  uint32 large_motor = 1;
  uint32 small_motor = 2;
}

message Disconnect {
  string reason = 1;
}

/// Single UDP packet that packs vibration + trigger effects + LED + audio
/// into one envelope so the Android side can process everything atomically
/// without racing separate bulkTransfers to the same HID endpoint.
message CompactFrame {
  Vibration vibration = 1;
  TriggerEffects trigger_effects = 2;
  LedState led_state = 3;
  AudioFrame audio_frame = 4;
  TestTone test_tone = 5;
}